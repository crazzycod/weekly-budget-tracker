<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f0f2" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spend">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Week Spend</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* Layout: one column, editorial headline, stacked overlapping cards */
:root{
  --bg:#f1f0f2;--ink:#0e0e10;--mute:#8d8c93;--line:#e3e2e7;--soft:#e5e4e9;--field:#f1f0f3;
  --panel:#ffffff;--sheet:#ffffff;--track:#dfdee4;--rowline:#efeef2;
  --navbg:#111113;--navfg:#8f8f96;--navon:#ffffff;--navonfg:#111113;
  --cardink:#19122d;--a1:#a983e8;--a2:#e4c8ef;
  --danger:#d63b3b;--warn:#d99a00;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Inter",Arial,sans-serif;
  --spring:cubic-bezier(.2,.9,.25,1.12);
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0d0d10;--ink:#f2f1f5;--mute:#8a8992;--line:#2a2a31;--soft:#232329;--field:#1c1c22;
  --panel:#17171c;--sheet:#18181d;--track:#2a2a31;--rowline:#24242a;
  --navbg:#232329;--navfg:#8a8992;--navon:#f2f1f5;--navonfg:#0d0d10;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;transition:background .3s,color .3s}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--ink);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
[hidden]{display:none!important}
svg{display:block}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.mute{color:var(--mute)}

/* ---------- Login ---------- */
#login{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column}
.lg-top{display:flex;justify-content:space-between;align-items:flex-start;font-size:16px;line-height:1.15}
.brand .sub{display:flex;align-items:center;gap:4px;color:var(--mute);padding-left:2px}
.brand .sub svg{width:38px;height:12px}
.lg-date{font-size:13px;text-align:right}
.poster{font-size:min(25vw,112px);line-height:.84;font-weight:500;letter-spacing:-.065em;margin-top:28px}
.lg-note{display:grid;grid-template-columns:44px 1fr;gap:6px;font-size:14px;line-height:1.35;margin-top:18px;max-width:300px}
.swatch{display:flex;margin-top:18px}
.swatch i{width:30px;height:30px;border-radius:50%;margin-right:-9px;border:2px solid var(--bg)}
.lg-warn{margin-top:16px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--danger) 14%,var(--bg));color:var(--danger);font-size:13px;line-height:1.4}
.lg-form{margin-top:auto;padding-top:20px}
.lg-hi{text-align:center;font-size:20px;letter-spacing:-.02em}
.lg-msg{text-align:center;font-size:14px;color:var(--mute);margin-top:4px}
.dots{display:flex;gap:16px;justify-content:center;margin:18px 0 6px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);transition:background .15s,transform .2s var(--spring)}
.dots i.f{background:var(--ink);transform:scale(1.1)}
.shake{animation:sh .42s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lg-err{color:var(--danger);text-align:center;font-size:13px;min-height:18px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.keys button{height:60px;border-radius:22px;background:var(--soft);font-size:26px;font-weight:400;display:grid;place-items:center;transition:transform .15s var(--spring),background .15s}
.keys button:active{transform:scale(.94);background:var(--line)}
.keys button.blank{background:transparent}
.keys svg{width:26px;height:26px}
.ufield label{font-size:13px;color:var(--mute);display:block;margin-bottom:6px}
.ufield input{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:none;font-size:30px;letter-spacing:-.03em;padding:4px 0 10px;outline:0;border-radius:0}
.lg-alt{text-align:center;font-size:14px;color:var(--mute);margin-top:14px}
.lg-alt button{text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.lg-where{text-align:center;font-size:11.5px;color:var(--mute);margin-top:10px;letter-spacing:.01em}

/* ---------- Main ---------- */
main{padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 112px)}
.top{display:flex;justify-content:space-between;align-items:center;height:48px}
.hl{display:flex;align-items:center;gap:8px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,var(--a1),var(--a2));color:#1b1230;display:grid;place-items:center;font-size:16px;font-weight:600}
.circle{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;transition:transform .2s var(--spring)}
.circle:active{transform:scale(.9)}
.circle svg{width:19px;height:19px}
.circle.ghost{background:transparent}
.eyebrow{margin-top:22px;font-size:20px;color:var(--mute);letter-spacing:-.01em}
.headline{display:flex;align-items:flex-end;gap:8px;font-size:70px;line-height:.95;font-weight:500;letter-spacing:-.05em;margin-top:2px}
.headline .caret{width:14px;height:14px;margin-bottom:14px;opacity:.3}
.pnav{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--mute)}
.pnav button{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.pnav button svg{width:15px;height:15px}
.pnav button:disabled{opacity:.3}
.summary{margin:22px 0}
.sum-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big-num{font-size:32px;font-weight:500;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--track);border-radius:6px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .8s var(--spring)}
.bar i.warn{background:var(--warn)}
.bar i.over{background:var(--danger)}
.sum-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--mute)}
.sum-meta .neg{color:var(--danger)}

.stack{display:flex;flex-direction:column}
.card{position:relative;display:block;width:100%;background:var(--cbg,var(--c));color:var(--ck,var(--cardink));border-radius:30px;padding:14px 18px 46px;margin-top:-32px;text-align:left;box-shadow:0 -6px 20px rgba(20,10,40,.08);transition:transform .35s var(--spring),box-shadow .35s}
.card:first-child{margin-top:0}
.card:last-child{padding-bottom:18px}
.card:active{transform:translateY(-6px) scale(.985);box-shadow:0 -10px 26px rgba(20,10,40,.14)}
.card-top{display:flex;align-items:center;gap:8px;height:42px}
.ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.42);display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px}
.pill{font-size:11.5px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.42);display:inline-flex;gap:5px;align-items:center}
.pill svg{width:12px;height:12px}
.row{display:flex;justify-content:space-between;gap:12px}
.row.meta{margin-top:12px;font-size:13px;opacity:.55}
.row.main{margin-top:3px;font-size:21px;letter-spacing:-.015em}
.ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{border:1.5px dashed var(--line);border-radius:30px;padding:34px 22px;text-align:center;color:var(--mute);font-size:15px;line-height:1.4}
.empty b{display:block;color:var(--ink);font-size:21px;font-weight:500;letter-spacing:-.02em;margin-bottom:6px}
.empty .btn{margin-top:16px}

/* Motion */
.card.enter{animation:cardIn .6s var(--spring) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(34px) scale(.95)}to{opacity:1;transform:none}}
.card.pop{animation:cardPop .7s var(--spring) both}
@keyframes cardPop{0%{opacity:0;transform:translateY(-40px) scale(1.04)}60%{opacity:1}100%{transform:none}}
.view-in{animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.headline.swap{animation:hSwap .45s var(--spring)}
@keyframes hSwap{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
:root.nomotion *,:root.nomotion *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Nav ---------- */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);background:var(--navbg);border-radius:40px;padding:6px;display:flex;gap:4px;box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:20}
#nav button{width:56px;height:46px;border-radius:30px;display:grid;place-items:center;color:var(--navfg);transition:background .25s,color .25s,transform .2s var(--spring)}
#nav button:active{transform:scale(.9)}
#nav button.on{background:var(--navon);color:var(--navonfg)}
#nav svg{width:21px;height:21px}

/* ---------- Sheets ---------- */
#sheetWrap{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheetWrap .scrim{position:absolute;inset:0;background:rgba(10,10,15,.4);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--sheet);border-radius:32px 32px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .42s var(--spring);max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheetWrap.open{pointer-events:auto}
#sheetWrap.open .scrim{opacity:1}
#sheetWrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-head h2{font-size:28px;font-weight:500;letter-spacing:-.035em}
.amt-field{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--line);padding:4px 0 10px;margin-bottom:14px}
.amt-field span{font-size:18px;color:var(--mute)}
.amt-field input{border:0;outline:0;background:none;font-size:50px;font-weight:500;letter-spacing:-.04em;width:100%;padding:0;min-width:0}
.field{display:block;width:100%;border:0;background:var(--field);border-radius:16px;padding:14px 16px;outline:0;margin-bottom:10px;appearance:none;-webkit-appearance:none;min-height:50px;text-align:left}
.field::-webkit-date-and-time-value{text-align:left}
.flabel{font-size:13px;color:var(--mute);margin:4px 2px 6px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 14px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipc{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px 8px 9px;border-radius:30px;background:var(--field);font-size:14px;border:2px solid transparent;transition:transform .2s var(--spring)}
.chipc:active{transform:scale(.94)}
.chipc svg{width:16px;height:16px}
.chipc .d{width:24px;height:24px;border-radius:50%;background:var(--cbg,var(--c));color:var(--ck,var(--cardink));display:grid;place-items:center}
.chipc.on{background:var(--cbg,var(--c));color:var(--ck,var(--cardink));border-color:var(--ink)}
.chipc.on .d{background:rgba(255,255,255,.5)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;height:56px;border-radius:30px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:500;margin-top:6px;transition:transform .2s var(--spring)}
.btn:active{transform:scale(.97)}
.btn.light{background:var(--soft);color:var(--ink)}
.btn-text{display:block;width:100%;padding:16px;font-size:15px}
.danger{color:var(--danger)}
.seg{display:flex;background:var(--field);border-radius:16px;padding:4px;margin-bottom:10px}
.seg button{flex:1;height:42px;border-radius:12px;font-size:14px;color:var(--mute);transition:background .2s,color .2s}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.mlist button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:18px;border-top:1px solid var(--rowline);text-align:left}
.mlist button:first-child{border-top:0}
.mlist svg{width:22px;height:22px}
.steps{counter-reset:s;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 40px;font-size:15px;line-height:1.45}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:600}
.steps b{font-weight:600}
.code{display:block;background:var(--field);border-radius:12px;padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;margin-top:6px;user-select:all;-webkit-user-select:all}
.note{font-size:13px;color:var(--mute);line-height:1.45;margin:6px 2px 12px}
textarea.field{min-height:140px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}

/* ---------- Insights ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 12px}
.kpi{background:var(--panel);border-radius:20px;padding:12px 14px;min-width:0}
.kpi small{display:block;font-size:12px;color:var(--mute)}
.kpi b{display:block;font-size:16px;font-weight:500;margin-top:4px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--panel);border-radius:26px;padding:18px;margin-bottom:12px}
.panel h3{font-size:15px;font-weight:500;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px}
.panel h3 span{color:var(--mute);font-weight:400;font-size:13px}
.chart{display:flex;align-items:stretch;gap:4px;height:160px}
.chart.dense{gap:2px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.chart .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .b{width:100%;max-width:30px;border-radius:8px;background:var(--ink);min-height:4px;transform-origin:bottom;animation:grow .7s var(--spring) both;animation-delay:calc(var(--i,0) * 30ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.chart.dense .b{border-radius:4px}
.chart .b.zero{background:var(--soft)}
.chart .b.today{background:var(--a1)}
.chart .lb{font-size:11px;color:var(--mute);height:14px;margin-top:6px;white-space:nowrap}
.catrow{margin-bottom:14px}
.catrow:last-child{margin-bottom:0}
.catrow .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:10px}
.catrow .t span:first-child{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cbg,var(--c));flex:none}
.track{height:10px;background:var(--field);border-radius:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--cbg,var(--c));border-radius:10px;transform-origin:left;animation:growX .8s var(--spring) both}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
.mrow{display:flex;justify-content:space-between;font-size:15px;padding:10px 0;border-top:1px solid var(--rowline)}
.mrow:first-of-type{border-top:0}
.mrow span:last-child{font-variant-numeric:tabular-nums}

/* ---------- Settings ---------- */
.gtitle{font-size:13px;color:var(--mute);margin:24px 4px 8px}
.group{background:var(--panel);border-radius:24px;overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;min-height:56px;border-top:1px solid var(--rowline);width:100%;text-align:left;font-size:16px}
.srow:first-child{border-top:0}
.srow.col{flex-direction:column;align-items:stretch;justify-content:center;padding:14px 16px;gap:10px}
.srow .v{color:var(--mute);font-size:15px;text-align:right}
.srow .v.ok{color:#2f9e5b}
.srow .v.bad{color:var(--danger)}
.srow input[type=number],.srow select{border:0;background:var(--field);border-radius:12px;padding:8px 12px;width:136px;text-align:right;outline:0;-webkit-appearance:none;appearance:none}
.srow select{text-align-last:right}
.srow>svg{width:18px;height:18px;color:var(--mute)}
.srow.danger{color:var(--danger)}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:#34c759;flex:none}
.srow input[switch]{width:auto;height:auto}
.srow .seg{margin:0;padding:3px;border-radius:12px;flex:none}
.srow .seg button{height:32px;padding:0 12px;border-radius:9px;font-size:13px}
.lbl small{display:block;font-size:12px;color:var(--mute);margin-top:2px}

.preview{display:flex;flex-direction:column;pointer-events:none}
.preview .card{padding:10px 14px 30px;margin-top:-22px;border-radius:22px;box-shadow:0 -4px 14px rgba(20,10,40,.08)}
.preview .card:first-child{margin-top:0}
.preview .card:last-child{padding-bottom:12px}
.preview .row.main{font-size:16px}
.preview .row.meta{margin-top:2px;font-size:11px}
.presets{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.preset{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute);width:62px}
.preset i{width:50px;height:50px;border-radius:50%;border:2.5px solid transparent;box-shadow:inset 0 0 0 3px var(--panel);transition:transform .2s var(--spring)}
.preset:active i{transform:scale(.9)}
.preset.on{color:var(--ink)}
.preset.on i{border-color:var(--ink)}
.mycolors{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{position:relative;width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);overflow:hidden;flex:none;cursor:pointer}
.sw input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;cursor:pointer;border:0;padding:0}
.swbtn{width:42px;height:42px;border-radius:50%;background:var(--field);display:grid;place-items:center;flex:none;color:var(--ink)}
.swbtn svg{width:18px;height:18px}
.swbtn:disabled{opacity:.35}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:30px;font-size:14px;z-index:80;transition:transform .4s var(--spring);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
/* Header: buddy + weather */
.hr{display:flex;align-items:center;gap:4px;min-width:0}
.buddy{position:relative;width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:14px}
.buddy img,.lg-buddy,.bpick img{image-rendering:pixelated;image-rendering:crisp-edges}
.buddy img{width:40px;height:40px;animation:bob 1.6s steps(2,end) infinite}
.buddy.jump img{animation:jump .6s var(--spring)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes jump{0%{transform:none}35%{transform:translateY(-10px) rotate(-8deg)}70%{transform:none}85%{transform:translateY(-3px)}100%{transform:none}}
#bubble{position:absolute;z-index:30;top:calc(env(safe-area-inset-top) + 64px);left:22px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.35;padding:10px 14px;border-radius:18px;border-top-left-radius:5px;width:max-content;max-width:min(250px,72vw);box-shadow:0 10px 24px rgba(0,0,0,.18);transform-origin:12px -6px;animation:bubIn .5s var(--spring) both;pointer-events:none}
#bubble.out{animation:bubOut .25s ease both}
@keyframes bubIn{from{opacity:0;transform:scale(.5) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes bubOut{to{opacity:0;transform:scale(.9) translateY(-4px)}}
.lg-buddy{display:block;width:52px;height:52px;margin:0 auto 6px;animation:bob 1.6s steps(2,end) infinite}
.wx{display:flex;align-items:center;gap:5px;height:36px;padding:0 12px 0 9px;border-radius:20px;background:var(--soft);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;min-width:0;transition:transform .2s var(--spring)}
.wx:active{transform:scale(.94)}
.wx svg{width:19px;height:19px;flex:none}
.wx small{font-size:12.5px;font-weight:400;color:var(--mute);max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx.ld svg{animation:pulse 1s ease-in-out infinite alternate}

.wxbig{display:flex;align-items:center;gap:16px;margin:4px 0 16px}
.wxbig .wxi{width:64px;height:64px;border-radius:22px;background:var(--field);display:grid;place-items:center}
.wxbig .wxi svg{width:34px;height:34px}
.wxbig b{font-size:46px;font-weight:500;letter-spacing:-.04em;line-height:1}
.wxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.wxgrid div{background:var(--field);border-radius:16px;padding:10px 12px}
.wxgrid small{display:block;font-size:12px;color:var(--mute)}
.wxgrid b{font-size:18px;font-weight:500}
.mlist .res{font-size:16px}
.mlist .res small{color:var(--mute);font-size:13px;margin-left:auto;text-align:right}

.buddies{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bpick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:16px;font-size:11px;color:var(--mute);border:2px solid transparent;transition:transform .2s var(--spring)}
.bpick:active{transform:scale(.92)}
.bpick img{width:40px;height:40px}
.bpick.on{background:var(--field);border-color:var(--ink);color:var(--ink)}
/* Days */
.cal{padding:16px 12px 14px}
.cal-h{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.cal-h b{font-size:17px;font-weight:500;letter-spacing:-.01em}
.cal-h .mute{font-size:13px;margin-right:auto;font-variant-numeric:tabular-nums}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:32px;height:32px;border-radius:50%;background:var(--field);display:grid;place-items:center}
.cal-nav svg{width:15px;height:15px}
.cal-nav button:disabled{opacity:.3}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-g.wd span{font-size:12px;color:var(--mute);padding:2px 0 6px}
.cday{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-variant-numeric:tabular-nums}
.cday span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .2s,color .2s,transform .25s var(--spring)}
.cday.today span{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cday.sel span{background:var(--ink);color:var(--bg);box-shadow:none}
.cday:active span{transform:scale(.86)}
.cday:disabled{opacity:.3}
.lv{display:block;width:5px;height:5px;border-radius:50%}
.lv.lo{background:var(--mute);width:4px;height:4px}
.lv.mid{background:var(--ink)}
.lv.hi{background:var(--danger);width:6px;height:6px}
.cal-key{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.cal-key span{display:flex;align-items:center;gap:5px}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:22px 2px 12px}
.dayhead .mute{font-size:15px}
.dh-date{font-size:36px;font-weight:500;letter-spacing:-.045em;line-height:1.05}
.dh-tot{text-align:right;min-width:0}
.dh-tot b{display:block;font-size:22px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dh-tot span{font-size:12px;color:var(--mute)}
.catpills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cpill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:20px;background:var(--cbg,var(--c));color:var(--ck,var(--cardink));font-size:13px;font-variant-numeric:tabular-nums}
.cpill svg{width:15px;height:15px}
.haptic{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

async function hashPin(salt, pin){

async function pinKey(k){

  if (L.pin.length >= 4) return;
  L.pin += k; renderLogin();
  if (L.pin.length < 4) return;
  const accts = S.get('accounts', {});
  if (L.mode === 'create'){
    if (L.step === 'pin'){ L.first = L.pin; L.pin = ''; L.step = 'confirm'; return setTimeout(renderLogin, 120); }
    if (L.pin !== L.first){ L.err = "PINs didn't match. Try again."; L.pin=''; L.first=''; L.step='pin'; L.shake=true; haptic(true); return setTimeout(renderLogin, 120); }
    const salt = rnd();

    S.set('accounts', accts);
    return enter(L.name, true);
  }
  const a = accts[L.name];
  if (a && a.hash === await hashPin(a.salt, L.pin)){ S.del('fails'); return enter(L.name); }
  const fails = S.get('fails', 0) + 1; S.set('fails', fails);

/* ================= Recurring ================= */
function advance(dstr, freq, anchor){
  const d = parse(dstr);
  if (freq === 'weekly'){ d.setDate(d.getDate()+7); return ymd(d); }
  const y = d.getFullYear() + (freq === 'yearly' ? 1 : 0);
  const m = d.getMonth() + (freq === 'monthly' ? 1 : 0);
  const last = new Date(y, m+1, 0).getDate();
  return ymd(new Date(y, m, Math.min(anchor || d.getDate(), last)));
}
function processRecurring(){
  if (!D) return 0;
  const t = today(); let added = 0;
  for (const s of D.subs){
    let guard = 0;
    while (s.next && s.next <= t && guard++ < 400){
      D.expenses.push({id:uid(), title:s.name, amount:s.amount, cat:s.cat, date:s.next, sub:s.id, created:Date.now()});
      s.next = advance(s.next, s.freq, s.anchor); added++;
    }
  }
  if (added) save();
  return added;
}

function range(o = offset){
  const t = new Date(); t.setHours(0,0,0,0);
  if (period === 'week'){
    const diff = (t.getDay() - D.settings.weekStart + 7) % 7;
    const s = new Date(t); s.setDate(t.getDate() - diff + o*7);
    const e = new Date(s); e.setDate(s.getDate() + 6);
    return {s, e};
  }
  const s = new Date(t.getFullYear(), t.getMonth()+o, 1);
  return {s, e: new Date(s.getFullYear(), s.getMonth()+1, 0)};
}
const inRange = r => { const a = ymd(r.s), b = ymd(r.e); return D.expenses.filter(x => x.date >= a && x.date <= b); };
function rangeLabel(r){
  const span = `${r.s.getDate()} ${MON[r.s.getMonth()]} – ${r.e.getDate()} ${MON[r.e.getMonth()]}`;
  if (period === 'week'){
    if (offset === 0) return 'This week · ' + span;
    if (offset === -1) return 'Last week · ' + span;
    return span + ' ' + r.e.getFullYear();
  }
  return (offset === 0 ? 'This month · ' : '') + `${MONTHS[r.s.getMonth()]} ${r.s.getFullYear()}`;
}
const byDate = (a,b) => a.date === b.date ? (a.created||0) - (b.created||0) : a.date.localeCompare(b.date);

/* ================= Views ================= */
function header(){
  const init = (user || '?').slice(0,1).toUpperCase();
  const left = T.buddyOn
    ? `<button class="buddy" data-act="buddy" aria-label="Your buddy, ${esc((SPR.sprites[T.buddy] || SPR.sprites.sprout).name)}"><img id="buddyImg" src="${spriteURL(T.buddy)}" alt="" width="40" height="40"></button>`
    : `<span class="avatar" aria-label="${esc(user)}">${esc(init)}</span>`;
  return `<header class="top">
    <div class="hl">${left}
      <button class="circle" data-act="add" aria-label="Add expense">${ic('plus',2)}</button></div>
    <div class="hr">${wxPill()}<button class="circle ghost" data-act="menu" aria-label="Menu">${ic('down',2)}</button></div>
  </header>`;
}
function periodBlock(eyebrow){
  const r = range();
  return `<div class="eyebrow">${eyebrow}</div>
    <button class="headline ${animate ? 'swap' : ''}" data-act="togglePeriod" aria-label="Switch week or month">${period === 'week' ? 'Week' : 'Month'}<span class="caret">${ic('down',3)}</span></button>
    <div class="pnav"><button data-act="prev" aria-label="Previous">${ic('left',2.2)}</button><span>${rangeLabel(r)}</span>
      <button data-act="next" aria-label="Next" ${offset >= 0 ? 'disabled' : ''}>${ic('right',2.2)}</button></div>`;
}
function timeOf(x){
  if (x.sub) return 'Auto';
  if (!x.created) return '';
  const c = new Date(x.created); if (ymd(c) !== x.date) return '';
  return c.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function card(x, i, mode){
  const c = cat(x.cat), d = parse(x.date);
  const dl = mode === 'day' ? timeOf(x) : period === 'week' ? DAYS[d.getDay()] : `${DAYS[d.getDay()].slice(0,3)} ${d.getDate()}`;
  const cls = x.id === lastAdded ? 'pop' : (animate ? 'enter' : '');
  return `<button class="card ${cls}" style="${catVars(c.id)};--i:${i}" data-act="edit" data-id="${x.id}">
    <div class="card-top"><span class="ic">${ic(c.id)}</span>${x.sub ? `<span class="pill">${ic('repeat',2)}Subscription</span>` : ''}${x.note ? `<span class="pill ttl" style="max-width:55%">${esc(x.note)}</span>` : ''}</div>
    <div class="row meta"><span>${c.name}</span><span>${dl}</span></div>
    <div class="row main"><span class="ttl">${esc(x.title || c.name)}</span><span class="amt">−${fmt(x.amount)}</span></div>
  </button>`;
}

function renderHome(){
  const r = range(), list = inRange(r).sort(byDate), total = sum(list);
  const limit = period === 'week' ? D.settings.weekly : D.settings.monthly;
  const ratio = limit > 0 ? total/limit : 0, left = limit - total;
  const cls = ratio > 1 ? 'over' : ratio > .85 ? 'warn' : '';
  return header() + periodBlock('Expenses') + `
    <div class="summary">
      <div class="sum-row"><div class="big-num" data-count="${total}">${fmt(total)}</div>${limit > 0 ? `<div class="mute">of ${fmt0(limit)}</div>` : ''}</div>
      ${limit > 0 ? `<div class="bar"><i class="${cls}" style="width:${Math.min(ratio,1)*100}%"></i></div>` : ''}
      <div class="sum-meta">${limit > 0 ? (left >= 0 ? `<span>${fmt0(left)} left</span>` : `<span class="neg">${fmt0(-left)} over budget</span>`) : '<span>No budget set</span>'}
        <span>${list.length} expense${list.length === 1 ? '' : 's'}</span></div>
    </div>
    <div class="stack">${list.length ? list.map(card).join('') :
      `<div class="empty"><b>Nothing spent ${offset === 0 ? 'yet' : 'here'}</b>${offset === 0 ? 'Tap + to log your first expense.' : 'No expenses in this period.'}
       ${offset === 0 ? `<button class="btn" data-act="add">Add expense</button>` : ''}</div>`}</div>`;
}

function renderStats(){
  const r = range(), list = inRange(r), total = sum(list);
  const days = []; for (let d = new Date(r.s); d <= r.e; d.setDate(d.getDate()+1)) days.push(new Date(d));
  const tk = today();
  const daily = days.map(d => { const k = ymd(d); return {d, k, v: sum(list.filter(x => x.date === k))}; });
  const max = Math.max(...daily.map(x => x.v), 1);
  const elapsed = offset === 0 ? Math.max(daily.filter(x => x.k <= tk).length, 1) : days.length;
  const avg = total / elapsed;
  const biggest = list.reduce((a,b) => (!a || +b.amount > +a.amount) ? b : a, null);
  const prevTotal = sum(inRange(range(offset-1)));
  const delta = prevTotal > 0 ? Math.round((total - prevTotal)/prevTotal*100) : null;
  const limit = period === 'week' ? D.settings.weekly : D.settings.monthly;
  const pace = avg * days.length;
  const dense = days.length > 7;
  const bars = daily.map((x, i) => {
    const lbl = dense ? ((x.d.getDate() === 1 || x.d.getDate() % 5 === 0) ? x.d.getDate() : '') : DAYS[x.d.getDay()].slice(0,1);
    const h = x.v ? Math.max(x.v/max*100, 4) : 3;
    return `<div class="col" title="${x.k}: ${fmt(x.v)}"><div class="bw"><div class="b ${!x.v ? 'zero' : ''} ${x.k === tk ? 'today' : ''}" style="height:${h}%;--i:${i}"></div></div><div class="lb">${lbl}</div></div>`;
  }).join('');
  const cats = CATS.map(c => ({c, v: sum(list.filter(x => x.cat === c.id))})).filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  const merch = {}; list.forEach(x => { const k = (x.title || cat(x.cat).name).trim(); merch[k] = (merch[k]||0) + +x.amount; });
  const top = Object.entries(merch).sort((a,b) => b[1]-a[1]).slice(0,5);
  return header() + periodBlock('Insights') + `
    <div class="kpis">
      <div class="kpi"><small>Total</small><b>${fmt0(total)}</b></div>
      <div class="kpi"><small>Daily avg</small><b>${fmt0(avg)}</b></div>
      <div class="kpi"><small>vs last ${period}</small><b>${delta == null ? '—' : (delta > 0 ? '+' : '') + delta + '%'}</b></div>
    </div>
    <div class="panel"><h3>Daily spend <span>${offset === 0 && limit > 0 ? `On pace for ${fmt0(pace)}` : (biggest ? 'Biggest: ' + fmt0(biggest.amount) : '')}</span></h3>
      <div class="chart ${dense ? 'dense' : ''}">${bars}</div></div>
    <div class="panel"><h3>By category <span>${cats.length} categor${cats.length === 1 ? 'y' : 'ies'}</span></h3>
      ${cats.length ? cats.map(x => `<div class="catrow" style="${catVars(x.c.id)}"><div class="t"><span><i class="dot"></i>${x.c.name}</span><span>${fmt(x.v)} · ${Math.round(x.v/total*100)}%</span></div><div class="track"><i style="width:${x.v/cats[0].v*100}%"></i></div></div>`).join('') : '<div class="mute" style="font-size:14px">No spending in this period.</div>'}
    </div>
    ${top.length ? `<div class="panel"><h3>Top places <span>where it went</span></h3>${top.map(([k,v]) => `<div class="mrow"><span class="ttl">${esc(k)}</span><span>${fmt(v)}</span></div>`).join('')}</div>` : ''}`;
}

function renderDays(){
  const tk = today(); if (!selDay || selDay > tk) selDay = tk;
  const t = new Date(), base = new Date(t.getFullYear(), t.getMonth() + calOff, 1);
  const y = base.getFullYear(), m = base.getMonth(), dim = new Date(y, m+1, 0).getDate();
  const lead = (base.getDay() - D.settings.weekStart + 7) % 7;
  const mk = `${y}-${pad(m+1)}`;
  const totals = {}; D.expenses.forEach(x => { totals[x.date] = (totals[x.date] || 0) + (+x.amount || 0); });
  const daily = D.settings.weekly > 0 ? D.settings.weekly/7 : (D.settings.monthly > 0 ? D.settings.monthly/30 : 0);
  const monthTotal = sum(D.expenses.filter(x => x.date.startsWith(mk)));
  const wd = [0,1,2,3,4,5,6].map(i => DAYS[(i + D.settings.weekStart) % 7].slice(0,1));
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let d = 1; d <= dim; d++){
    const k = `${mk}-${pad(d)}`, v = totals[k] || 0;
    const lvl = !v ? '' : !daily ? 'mid' : v > daily ? 'hi' : v > daily*.5 ? 'mid' : 'lo';
    cells += `<button class="cday ${k === selDay ? 'sel' : ''} ${k === tk ? 'today' : ''}" data-day="${k}" ${k > tk ? 'disabled' : ''} aria-label="${d} ${MONTHS[m]}${v ? ', ' + fmt(v) : ''}"><span>${d}</span><i class="lv ${lvl}"></i></button>`;
  }
  const sd = parse(selDay);
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const rel = selDay === tk ? 'Today' : selDay === ymd(yest) ? 'Yesterday' : DAYS[sd.getDay()];
  const list = D.expenses.filter(x => x.date === selDay).sort(byDate), tot = sum(list);
  const cats = CATS.map(c => ({c, v: sum(list.filter(x => x.cat === c.id))})).filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  const vs = daily && tot ? ` · ${tot <= daily ? fmt0(daily - tot) + ' under' : fmt0(tot - daily) + ' over'} daily budget` : '';
  return header() + `
    <div class="eyebrow">History</div>
    <div class="headline">Days</div>
    <div class="panel cal" style="margin-top:20px">
      <div class="cal-h"><b>${MONTHS[m]} ${y}</b><span class="mute">${fmt0(monthTotal)}</span>
        <div class="cal-nav"><button data-act="calPrev" aria-label="Previous month">${ic('left',2.2)}</button><button data-act="calNext" aria-label="Next month" ${calOff >= 0 ? 'disabled' : ''}>${ic('right',2.2)}</button></div></div>
      <div class="cal-g wd">${wd.map(w => `<span>${w}</span>`).join('')}</div>
      <div class="cal-g">${cells}</div>
      ${daily ? `<div class="cal-key"><span><i class="lv lo"></i>Light</span><span><i class="lv mid"></i>Normal</span><span><i class="lv hi"></i>Over daily budget</span></div>` : ''}
    </div>
    <div class="dayhead">
      <div><div class="mute">${rel}</div><div class="dh-date">${sd.getDate()} ${MON[sd.getMonth()]}</div></div>
      <div class="dh-tot"><b>${fmt(tot)}</b><span>${list.length} expense${list.length === 1 ? '' : 's'}${vs}</span></div>
    </div>
    ${cats.length ? `<div class="catpills">${cats.map(x => `<span class="cpill" style="${catVars(x.c.id)}">${ic(x.c.id)}${x.c.name} · ${fmt0(x.v)}</span>`).join('')}</div>` : ''}
    <div class="stack">${list.length ? list.map((x, i) => card(x, i, 'day')).join('') :
      `<div class="empty"><b>Nothing spent</b>${selDay === tk ? 'No expenses logged today yet.' : 'No expenses on this day.'}</div>`}</div>
    <button class="btn" data-act="addOn" style="margin-top:16px">Add expense on ${sd.getDate()} ${MON[sd.getMonth()]}</button>`;
}

const monthlyEq = s => s.freq === 'weekly' ? s.amount*52/12 : s.freq === 'yearly' ? s.amount/12 : +s.amount;
function dueLabel(dstr){
  const n = Math.round((parse(dstr) - parse(today()))/86400000);
  if (n <= 0) return 'Due today'; if (n === 1) return 'Tomorrow';
  if (n < 7) return 'In ' + n + ' days';
  const d = parse(dstr); return `${d.getDate()} ${MON[d.getMonth()]}`;
}
function renderSubs(){
  const subs = [...D.subs].sort((a,b) => a.next.localeCompare(b.next));
  const monthly = subs.reduce((a,s) => a + monthlyEq(s), 0);
  const F = {weekly:'Weekly', monthly:'Monthly', yearly:'Yearly'};
  return header() + `
    <div class="eyebrow">Recurring</div>
    <div class="headline">Subs</div>
    <div class="summary">
      <div class="sum-row"><div class="big-num" data-count="${monthly}">${fmt(monthly)}</div><div class="mute">per month</div></div>
      <div class="sum-meta"><span>${fmt0(monthly*12)} a year</span><span>${subs.length} active</span></div>
    </div>
    <div class="stack">${subs.length ? subs.map((s, i) => { const c = cat(s.cat); return `
      <button class="card ${animate ? 'enter' : ''}" style="${catVars(c.id)};--i:${i}" data-act="editSub" data-id="${s.id}">
        <div class="card-top"><span class="ic">${ic(c.id)}</span><span class="pill">${ic('repeat',2)}${F[s.freq]}</span></div>
        <div class="row meta"><span>${c.name}</span><span>${dueLabel(s.next)}</span></div>
        <div class="row main"><span class="ttl">${esc(s.name)}</span><span class="amt">−${fmt(s.amount)}</span></div>
      </button>`; }).join('') :
      `<div class="empty"><b>No subscriptions</b>Add things like Netflix, gym or rent. They log themselves on their due date.</div>`}</div>
    <button class="btn" data-act="addSub" style="margin-top:16px">Add subscription</button>
    <p class="note" style="text-align:center;margin-top:12px">Payments are added to your expenses on the due date, the next time you open the app.</p>`;
}

function renderNav(){
  const items = [['home','spend','Spending'],['days','cal','Days'],['stats','stats','Insights'],['subs','repeat','Subscriptions'],['settings','sliders','Settings']];
  $('#nav').innerHTML = items.map(([v,i,l]) => `<button class="${view === v ? 'on' : ''}" data-nav="${v}" aria-label="${l}">${ic(i,2)}</button>`).join('');
}

function countUp(el){
  const to = parseFloat(el.dataset.count) || 0, from = lastTotal;
  if (!motionOn() || Math.abs(to - from) < .01){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  const step = t => { const p = Math.min((t - t0)/dur, 1), e = 1 - Math.pow(1-p, 3); el.textContent = fmt(from + (to-from)*e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function render(newView){
  if (!user) return;
  const fn = {home:renderHome, days:renderDays, stats:renderStats, subs:renderSubs, settings:renderSettings}[view];
  const v = $('#view');
  const keepScroll = view === 'settings' && !newView ? window.scrollY : null;
  v.innerHTML = fn();
  renderNav();
  const num = v.querySelector('.big-num[data-count]');
  if (num){ countUp(num); lastTotal = parseFloat(num.dataset.count) || 0; }
  if (newView){
    if (motionOn()){ v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in'); }
    window.scrollTo(0,0);
  } else if (keepScroll != null) window.scrollTo(0, keepScroll);
  animate = false; lastAdded = null;
}

/* ================= Sheets ================= */
function openSheet(html){
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#sheetWrap').classList.add('open'); $('#sheetWrap').setAttribute('aria-hidden','false');
}
function closeSheet(){ $('#sheetWrap').classList.remove('open'); $('#sheetWrap').setAttribute('aria-hidden','true'); }
const sheetHead = t => `<div class="sh-head"><h2>${t}</h2><button class="circle" data-act="close" aria-label="Close">${ic('close',2)}</button></div>`;
const catChips = sel => `<div class="chips" id="fCats">${CATS.map(c => `<button class="chipc ${c.id === sel ? 'on' : ''}" data-cat="${c.id}" style="${catVars(c.id)}"><span class="d">${ic(c.id)}</span>${c.name}</button>`).join('')}</div>`;
const selCat = () => ($('#fCats .chipc.on') || {}).dataset?.cat || 'other';
function readAmount(id){ const v = parseFloat(String($(id).value).replace(/,/g,'.').replace(/[^\d.]/g,'')); return isFinite(v) ? round2(v) : NaN; }

function openExpense(id, pre = {}){
  const x = id ? D.expenses.find(e => e.id === id) : null;
  const c = x ? x.cat : (CATS.some(k => k.id === (pre.cat||'').toLowerCase()) ? pre.cat.toLowerCase() : 'food');
  openSheet(sheetHead(x ? 'Edit expense' : 'New expense') + `
    <label class="amt-field"><span>AED</span><input id="fAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" value="${x ? x.amount : esc(pre.amt || '')}"></label>
    <input id="fTitle" class="field" placeholder="Where or what? e.g. Carrefour" maxlength="40" value="${esc(x ? x.title : (pre.title || ''))}">
    <span class="flabel">Category</span>
    ${catChips(c)}
    <div class="two">
      <div><span class="flabel">Date</span><input id="fDate" type="date" class="field" value="${x ? x.date : (pre.date || today())}" max="${today()}"></div>
      <div><span class="flabel">Note</span><input id="fNote" class="field" placeholder="Optional" maxlength="30" value="${esc(x?.note || '')}"></div>
    </div>
    <button class="btn" data-act="saveExp" data-id="${x ? x.id : ''}">${x ? 'Save changes' : 'Add expense'}</button>
    ${x ? `<button class="btn-text danger" data-act="delExp" data-id="${x.id}">Delete expense</button>` : ''}`);
  if (!x) setTimeout(() => { try{ $('#fAmt').focus(); }catch(e){} }, 380);
}
function saveExpense(id){
  const amount = readAmount('#fAmt');
  if (!(amount > 0)) { toast('Enter an amount'); haptic(true); return $('#fAmt').focus(); }
  const date = $('#fDate').value || today();
  const data = {title: $('#fTitle').value.trim(), amount, cat: selCat(), date, note: $('#fNote').value.trim()};
  if (id){ Object.assign(D.expenses.find(e => e.id === id), data); toast('Saved'); }
  else {
    const nid = uid(); D.expenses.push({id: nid, created: Date.now(), ...data}); lastAdded = nid; toast(`${fmt(amount)} added`);
    const r = range(); if (date < ymd(r.s) || date > ymd(r.e)) offset = 0;
    if (view === 'days') selDay = date; else if (view !== 'home') view = 'home';
  }
  save(); closeSheet(); render();
}

function openSub(id){
  const s = id ? D.subs.find(x => x.id === id) : null;
  const f = s ? s.freq : 'monthly';
  openSheet(sheetHead(s ? 'Edit subscription' : 'New subscription') + `
    <label class="amt-field"><span>AED</span><input id="fAmt" inputmode="decimal" placeholder="0.00" value="${s ? s.amount : ''}"></label>
    <input id="fTitle" class="field" placeholder="Name, e.g. Netflix" maxlength="40" value="${esc(s ? s.name : '')}">
    <span class="flabel">Repeats</span>
    <div class="seg" id="fFreq">${['weekly','monthly','yearly'].map(v => `<button data-freq="${v}" class="${v === f ? 'on' : ''}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>
    <span class="flabel">Category</span>
    ${catChips(s ? s.cat : 'entertainment')}
    <span class="flabel">Next payment</span>
    <input id="fDate" type="date" class="field" value="${s ? s.next : today()}">
    <p class="note">If the date is today or earlier, the payment is logged right away.</p>
    <button class="btn" data-act="saveSub" data-id="${s ? s.id : ''}">${s ? 'Save changes' : 'Add subscription'}</button>
    ${s ? `<button class="btn-text danger" data-act="delSub" data-id="${s.id}">Delete subscription</button>` : ''}`);
}
function saveSub(id){
  const amount = readAmount('#fAmt'), name = $('#fTitle').value.trim();
  if (!(amount > 0)){ haptic(true); return toast('Enter an amount'); }
  if (!name){ haptic(true); return toast('Give it a name'); }
  const next = $('#fDate').value || today();
  const freq = ($('#fFreq .on') || {}).dataset?.freq || 'monthly';
  const data = {name, amount, cat: selCat(), freq, next, anchor: parse(next).getDate()};
  if (id) Object.assign(D.subs.find(s => s.id === id), data);
  else D.subs.push({id: uid(), ...data});
  const added = processRecurring();
  save(); closeSheet(); animate = true; render();
  toast(added ? `Saved · ${added} payment${added>1?'s':''} logged` : 'Subscription saved');
}

let confirmFn = null;
function askConfirm(title, msg, okLabel, fn){
  confirmFn = fn;
  openSheet(sheetHead(title) + `<p class="note" style="font-size:15px;color:var(--ink)">${msg}</p>
    <button class="btn" data-act="confirmOk" style="background:var(--danger);color:#fff">${okLabel}</button>
    <button class="btn-text" data-act="close">Cancel</button>`);
}

function openMenu(){
  openSheet(sheetHead('Menu') + `<div class="mlist">
    <button data-nav="home">${ic('spend')}Spending</button>
    <button data-nav="days">${ic('cal')}Days</button>
    <button data-nav="stats">${ic('stats')}Insights</button>
    <button data-nav="subs">${ic('repeat')}Subscriptions</button>
    <button data-nav="settings">${ic('sliders')}Settings</button>
    <button data-act="lockNow">${ic('lock')}Lock now</button></div>`);
}

function quickLink(){ return location.origin + location.pathname + '?add=1'; }
function appLink(){ return location.origin + location.pathname; }
function openActionHelp(){
  openSheet(sheetHead('Action Button') + `
    <p class="note">iPhone can keep separate data for each way a site is opened. To make sure your profile is always there, open the app through <b>one shortcut</b> for both the Action Button and the Home Screen.</p>
    <ol class="steps">
      <li>Delete any old Spend icon from your Home Screen (press and hold → Remove Bookmark). Your data isn't touched.</li>
      <li>In <b>Shortcuts</b>, tap <b>+</b>, add <b>Open URLs</b> and paste:<span class="code">${esc(quickLink())}</span></li>
      <li>Rename it <b>Log expense</b>. Tap the shortcut's <b>ⓘ</b> → <b>Add to Home Screen</b> for your app icon.</li>
      <li>iPhone <b>Settings → Action Button</b> → swipe to <b>Shortcut</b> → pick <b>Log expense</b>.</li>
    </ol>
    <p class="note">Still asked to sign up each time? Check that Safari is your default browser, you're not in Private Browsing, and <b>Settings → Apps → Safari → Block All Cookies</b> is off. If you use Safari Profiles, shortcuts open in your default profile.</p>
    <p class="note">Right now: opened in <b>${isStandalone() ? 'Home Screen app' : 'Safari'}</b>, saving data <b>${STORAGE_OK ? 'works' : 'is blocked'}</b>, <b>${accountCount()}</b> account(s) here.</p>
    <button class="btn" data-act="copyLink">Copy quick-add link</button>`);
}

function openChangePin(){
  openSheet(sheetHead('Change PIN') + `
    <input id="pOld" class="field" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Current PIN" autocomplete="current-password">
    <input id="pNew" class="field" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="New 4-digit PIN" autocomplete="new-password">
    <input id="pNew2" class="field" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Confirm new PIN" autocomplete="new-password">
    <button class="btn" data-act="savePin">Update PIN</button>`);
}
async function savePin(){
  const accts = S.get('accounts', {}), a = accts[user];
  const o = $('#pOld').value, n = $('#pNew').value, n2 = $('#pNew2').value;
  if (a.hash !== await hashPin(a.salt, o)){ haptic(true); return toast('Current PIN is wrong'); }
  if (!/^\d{4}$/.test(n)){ haptic(true); return toast('New PIN must be 4 digits'); }
  if (n !== n2){ haptic(true); return toast("New PINs don't match"); }
  a.salt = rnd(); a.hash = await hashPin(a.salt, n); S.set('accounts', accts);
  closeSheet(); toast('PIN updated');
}

function exportData(){
  const payload = JSON.stringify({app:'week-spend', v:1, user, exported:new Date().toISOString(), data:D, theme:T});
  openSheet(sheetHead('Export backup') + `
    <p class="note">Copy this backup and keep it in Notes or send it to yourself. Paste it into Import backup to restore.</p>
    <textarea id="expText" class="field" readonly>${esc(payload)}</textarea>
    <button class="btn" data-act="copyBackup">Copy backup</button>`);
}
async function copyBackup(){
  const t = $('#expText');
  try{ await navigator.clipboard.writeText(t.value); toast('Backup copied'); }
  catch(e){ t.focus(); t.select(); toast('Selected. Tap Copy.'); }
}
function openImport(){
  openSheet(sheetHead('Import backup') + `
    <p class="note">Choose a backup file, or paste its contents. This replaces the expenses, subscriptions and budget for <b>${esc(user)}</b>.</p>
    <label class="btn light" style="display:grid;place-items:center">Choose file<input id="impFile" type="file" accept="application/json,.json,.txt" hidden></label>
    <span class="flabel" style="margin-top:14px">Or paste</span>
    <textarea id="impText" class="field" placeholder='{"app":"week-spend", ...}'></textarea>
    <button class="btn" data-act="doImport">Import</button>`);
  $('#impFile').addEventListener('change', async e => { const f = e.target.files[0]; if (f) { $('#impText').value = await f.text(); toast('File loaded. Tap Import.'); } });
}
function doImport(){
  try{
    const j = JSON.parse($('#impText').value);
    const d = j.data || j;
    if (!Array.isArray(d.expenses)) throw new Error('bad');
    askConfirm('Replace data?', `Replace your current data with ${d.expenses.length} expenses from this backup?`, 'Replace', () => {
      D = {expenses:d.expenses, subs:d.subs||[], settings:{...DEF_SETTINGS, ...(d.settings||{})}};
      if (j.theme) { T = {...DEF_THEME, ...j.theme}; saveTheme(); }
      save(); processRecurring(); closeSheet(); animate = true; render(); toast('Backup imported');
    });
  }catch(e){ haptic(true); toast("That doesn't look like a Week Spend backup"); }
}

async function copyLink(){
  const link = quickLink();
  try{ await navigator.clipboard.writeText(link); toast('Quick-add link copied'); }
  catch(e){ openSheet(sheetHead('Quick-add link') + `<p class="note">Press and hold to copy:</p><span class="code">${esc(link)}</span>`); }
}

/* ---------- Theme editing ---------- */
function editablePalette(){
  if (T.preset !== 'custom' || !Array.isArray(T.custom)) { T.custom = palette().slice(0, 8); T.preset = 'custom'; }
  return T.custom;
}
function refreshThemeUI(){
  const p = $('#themePreview'); if (p) p.outerHTML = previewHTML();
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  if (e.target.closest('.haptic')) return;
  const k = e.target.closest('[data-key]');
  if (k){ haptic(); pinKey(k.dataset.key); return; }
  const c = e.target.closest('[data-cat]');
  if (c){ haptic(); document.querySelectorAll('#fCats .chipc').forEach(b => b.classList.toggle('on', b === c)); return; }
  const f = e.target.closest('[data-freq]');
  if (f){ haptic(); document.querySelectorAll('#fFreq button').forEach(b => b.classList.toggle('on', b === f)); return; }
  const n = e.target.closest('[data-nav]');
  if (n){ haptic(); closeSheet(); if (view !== n.dataset.nav){ view = n.dataset.nav; animate = true; render(true); } return; }
  const tk = e.target.closest('[data-theme-key]');
  if (tk){
    haptic();
    const key = tk.dataset.themeKey, val = tk.dataset.themeVal;
    T[key] = key === 'gradient' ? val === 'true' : val; saveTheme(); render(); return;
  }
  const dy = e.target.closest('[data-day]');
  if (dy){ haptic(); selDay = dy.dataset.day; animate = true; render(); return; }
  const bp = e.target.closest('[data-buddy]');
  if (bp){ haptic(); T.buddy = bp.dataset.buddy; saveTheme(); render(); setTimeout(() => say(`Hi! I'm ${SPR.sprites[T.buddy].name}.`), 120); return; }
  const pr = e.target.closest('[data-preset]');
  if (pr){ haptic(); T.preset = pr.dataset.preset; saveTheme(); render(); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  haptic();
  const id = a.dataset.id;
  switch (a.dataset.act){
    case 'lgNext': lgNext(); break;
    case 'lgMode':
      if (a.dataset.mode === 'other'){ resetLogin('login'); L.step = 'name'; L.name = ''; }
      else resetLogin(a.dataset.mode);
      renderLogin(); break;
    case 'add': openExpense(); break;
    case 'edit': openExpense(id); break;
    case 'saveExp': saveExpense(id); break;
    case 'delExp': askConfirm('Delete expense?', 'This removes it from your spending.', 'Delete', () => { D.expenses = D.expenses.filter(x => x.id !== id); save(); closeSheet(); render(); toast('Deleted'); }); break;
    case 'addSub': openSub(); break;
    case 'editSub': openSub(id); break;
    case 'saveSub': saveSub(id); break;
    case 'delSub': askConfirm('Delete subscription?', 'Past payments stay in your expenses.', 'Delete', () => { D.subs = D.subs.filter(x => x.id !== id); save(); closeSheet(); render(); toast('Deleted'); }); break;
    case 'togglePeriod': period = period === 'week' ? 'month' : 'week'; offset = 0; animate = true; render(); break;
    case 'prev': offset--; animate = true; render(); break;
    case 'next': if (offset < 0){ offset++; animate = true; render(); } break;
    case 'menu': openMenu(); break;
    case 'buddy': pokeBuddy(); break;
    case 'wx': openWx(); break;
    case 'wxLocate': requestLocation(true); break;
    case 'wxPick': { const r = wxResults[+a.dataset.i]; if (r){ W.lat = +r.latitude.toFixed(3); W.lon = +r.longitude.toFixed(3); W.place = r.name; W.mode = 'city'; W.asked = true; saveW(); closeSheet(); wxFetch(true).then(() => { if (view === 'settings') render(); }); toast('Weather for ' + r.name); } break; }
    case 'calPrev': calOff--; render(); break;
    case 'calNext': if (calOff < 0){ calOff++; render(); } break;
    case 'addOn': openExpense(null, {date: selDay}); break;
    case 'close': closeSheet(); break;
    case 'confirmOk': { const fn = confirmFn; confirmFn = null; if (fn) fn(); break; }
    case 'lockNow': lockApp(); break;
    case 'logout': askConfirm('Log out?', 'You can log back in with your PIN.', 'Log out', lockApp); break;
    case 'changePin': openChangePin(); break;
    case 'savePin': savePin(); break;
    case 'exportData': exportData(); break;
    case 'copyBackup': copyBackup(); break;
    case 'importData': openImport(); break;
    case 'doImport': doImport(); break;
    case 'copyLink': copyLink(); break;
    case 'actionHelp': openActionHelp(); break;
    case 'addColor': { const p = editablePalette(); if (p.length < 8){ const base = PRESETS.classic.colors; p.push(base.find(c => !p.includes(c)) || '#cccccc'); saveTheme(); render(); } break; }
    case 'rmColor': { const p = editablePalette(); if (p.length > 2){ p.pop(); saveTheme(); render(); } break; }
    case 'deleteAcct':
      askConfirm('Delete account?', `Delete "${esc(user)}" and all its data from this device. This can't be undone.`, 'Delete everything', () => {
        const accts = S.get('accounts', {}); delete accts[user]; S.set('accounts', accts);
        S.del('data_'+user); if (S.get('last') === user) S.del('last');
        lockApp(); toast('Account deleted');
      });
      break;
  }
});
// Live color editing: update preview while the picker is open, save when it closes.
document.addEventListener('input', e => {
  const ci = e.target.closest('[data-ci]');
  if (!ci) return;
  const p = editablePalette(), i = +ci.dataset.ci;
  if (isHex(ci.value)){ p[i] = ci.value; ci.parentElement.style.background = ci.value; applyTheme(); refreshThemeUI(); }
});
document.addEventListener('change', e => {
  const ci = e.target.closest('[data-ci]');
  if (ci){ saveTheme(); render(); toast('Colors saved'); return; }
  const tg = e.target.closest('[data-theme-toggle]');
  if (tg){
    const k = tg.dataset.themeToggle; T[k] = tg.checked; saveTheme();
    if (tg.checked && k === 'haptics') haptic();
    if (k === 'buddyOn'){ render(); if (!tg.checked){ const bb = $('#bubble'); if (bb) bb.hidden = true; } }
    if (tg.checked && k === 'greet') greet();
    return;
  }
  const wt = e.target.closest('[data-wx-toggle]');
  if (wt){ W.on = wt.checked; saveW(); render(); if (W.on) wxRefresh(); return; }
  const t = e.target.closest('[data-set]');
  if (!t || !D) return;
  D.settings[t.dataset.set] = Math.max(0, parseFloat(t.value) || 0); save(); touchSession();
  toast('Saved');
});
document.addEventListener('keydown', e => {
  if (!$('#login').hidden && L.step !== 'name'){
    if (/^\d$/.test(e.key)) pinKey(e.key);
    else if (e.key === 'Backspace') pinKey('del');
  } else if (e.key === 'Escape') closeSheet();
});

/* ================= Boot ================= */
(function boot(){
  const u = sessionUser();
  if (u){ enter(u); }
  else { resetLogin(); renderLogin(); }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
